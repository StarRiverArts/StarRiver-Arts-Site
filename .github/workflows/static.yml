# Deploy only the public runtime surface to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - ".github/workflows/static.yml"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.json"
      - "**/*.xml"
      - "robots.txt"
      - "llms.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate discovery files before staging
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = "https://starriverarts.github.io/StarRiver-Arts-Site/"
          sitemap = Path("sitemap.xml")
          if not sitemap.exists():
              raise SystemExit("sitemap.xml is missing")
          root = ET.parse(sitemap).getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locs = [
              (node.text or "").strip()
              for node in root.findall("sm:url/sm:loc", ns)
          ]
          if not locs:
              raise SystemExit("sitemap.xml has no URLs")
          bad = [url for url in locs if not url.startswith(base)]
          if bad:
              raise SystemExit(f"sitemap.xml contains non-canonical URLs: {bad[:5]}")

          robots = Path("robots.txt")
          if not robots.exists():
              raise SystemExit("robots.txt is missing")
          expected = base + "sitemap.xml"
          if f"Sitemap: {expected}" not in robots.read_text(encoding="utf-8"):
              raise SystemExit("robots.txt does not point to the canonical sitemap")

          print(f"Validated {len(locs)} sitemap URLs before staging")
          PY

      - name: Stage public Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          public_dirs=(
            assets
            data
            downloads_Museum
            fonts
            Images
            museum
            play
            projects
          )

          public_files=(
            404.html
            index.html
            studio.html
            museum.html
            play.html
            store.html
            social.html
            landing.css
            social.css
            social-blueprint.css
            colors_and_type.css
            ds-additions.css
            site-index.json
            search-index.json
            llm-index.json
            site-index.schema.json
            sitemap.xml
            robots.txt
            llms.txt
          )

          for dir in "${public_dirs[@]}"; do
            if [[ -d "$dir" ]]; then
              rsync -a \
                --exclude='.DS_Store' \
                --exclude='.*' \
                --exclude='*.md' \
                "$dir/" "_site/$dir/"
            fi
          done

          for file in "${public_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Required public file is missing: $file" >&2
              exit 1
            fi
            cp -p "$file" "_site/$file"
          done

          touch _site/.nojekyll

      - name: Validate staged artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import xml.etree.ElementTree as ET

          root = Path("_site")
          base_path = "/StarRiver-Arts-Site/"

          forbidden = [
              ".agent-index",
              ".claude",
              ".github",
              "docs",
              "tools",
              "content",
              "uploads",
              "screenshots",
              "AGENTS.md",
              "StarRiver-Arts-Site.code-workspace",
              "agent-index.config.json",
              ".gitignore",
          ]
          leaked = [name for name in forbidden if (root / name).exists()]
          if leaked:
              raise SystemExit(f"Non-public paths leaked into Pages artifact: {leaked}")

          sitemap = root / "sitemap.xml"
          tree = ET.parse(sitemap)
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          missing = []
          checked = 0
          for node in tree.getroot().findall("sm:url/sm:loc", ns):
              url = (node.text or "").strip()
              path = unquote(urlparse(url).path)
              if not path.startswith(base_path):
                  missing.append((url, "outside canonical base"))
                  continue
              rel = path[len(base_path):]
              candidate = root / rel
              if not rel or rel.endswith("/"):
                  candidate = candidate / "index.html"
              if not candidate.exists():
                  missing.append((url, candidate.as_posix()))
              checked += 1

          if missing:
              preview = "\n".join(f"- {url} -> {path}" for url, path in missing[:10])
              raise SystemExit(f"Sitemap URLs missing from staged artifact:\n{preview}")

          robots = (root / "robots.txt").read_text(encoding="utf-8")
          expected = "https://starriverarts.github.io/StarRiver-Arts-Site/sitemap.xml"
          if f"Sitemap: {expected}" not in robots:
              raise SystemExit("Staged robots.txt lost the canonical sitemap pointer")

          files = sum(1 for path in root.rglob("*") if path.is_file())
          size = sum(path.stat().st_size for path in root.rglob("*") if path.is_file())
          print(f"Staged {files} public files; {size / 1024 / 1024:.1f} MiB")
          print(f"Verified {checked} sitemap URLs exist in the staged artifact")
          PY
          du -sh _site

      - name: Upload staged site for deploy job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: staged-pages-site
          path: _site
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download staged site
        uses: actions/download-artifact@v4
        with:
          name: staged-pages-site
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed sitemap and robots
        run: |
          python - <<'PY'
          import time
          import urllib.request

          urls = {
              "sitemap": "https://starriverarts.github.io/StarRiver-Arts-Site/sitemap.xml",
              "robots": "https://starriverarts.github.io/StarRiver-Arts-Site/robots.txt",
          }
          for label, url in urls.items():
              last_error = None
              for attempt in range(12):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "StarRiver-Pages-Verify/1.0"})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          body = response.read()
                          if response.status == 200 and body:
                              print(label, response.status, response.headers.get("Content-Type"), len(body))
                              break
                  except Exception as exc:
                      last_error = exc
                  time.sleep(5)
              else:
                  raise SystemExit(f"Unable to fetch deployed {label}: {last_error}")
          PY
