# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate discovery files before deploy
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = "https://starriverarts.github.io/StarRiver-Arts-Site/"
          sitemap = Path("sitemap.xml")
          if not sitemap.exists():
              raise SystemExit("sitemap.xml is missing")
          root = ET.parse(sitemap).getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locs = [
              (node.text or "").strip()
              for node in root.findall("sm:url/sm:loc", ns)
          ]
          if not locs:
              raise SystemExit("sitemap.xml has no URLs")
          bad = [url for url in locs if not url.startswith(base)]
          if bad:
              raise SystemExit(f"sitemap.xml contains non-canonical URLs: {bad[:5]}")

          robots = Path("robots.txt")
          if not robots.exists():
              raise SystemExit("robots.txt is missing")
          expected = base + "sitemap.xml"
          if f"Sitemap: {expected}" not in robots.read_text(encoding="utf-8"):
              raise SystemExit("robots.txt does not point to the canonical sitemap")

          print(f"Validated {len(locs)} sitemap URLs before deploy")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed sitemap and robots
        run: |
          python - <<'PY'
          import time
          import urllib.request

          urls = {
              "sitemap": "https://starriverarts.github.io/StarRiver-Arts-Site/sitemap.xml",
              "robots": "https://starriverarts.github.io/StarRiver-Arts-Site/robots.txt",
          }
          for label, url in urls.items():
              last_error = None
              for attempt in range(12):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "StarRiver-Pages-Verify/1.0"})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          body = response.read()
                          if response.status == 200 and body:
                              print(label, response.status, response.headers.get("Content-Type"), len(body))
                              break
                  except Exception as exc:
                      last_error = exc
                  time.sleep(5)
              else:
                  raise SystemExit(f"Unable to fetch deployed {label}: {last_error}")
          PY
