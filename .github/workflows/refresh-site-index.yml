name: Refresh discovery indexes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.md"
      - "**/*.json"
      - "tools/build_agent_index.py"
      - "tools/build_site_index.py"
      - "agent-index.config.json"
      - ".github/workflows/refresh-site-index.yml"
  push:
    branches: ["**"]
    paths:
      - "**/*.html"
      - "**/*.md"
      - "**/*.json"
      - "tools/build_agent_index.py"
      - "tools/build_site_index.py"
      - "agent-index.config.json"
      - ".github/workflows/refresh-site-index.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild discovery indexes
        run: |
          python tools/build_site_index.py
          python tools/build_agent_index.py

      - name: Validate generated content
        run: |
          # Do not rebuild build_site_index.py here. It writes generated_at,
          # which would immediately invalidate the agent-index source digest.
          python tools/build_agent_index.py --check
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          outputs = [
              Path("site-index.json"),
              Path("search-index.json"),
              Path("llm-index.json"),
              Path("sitemap.xml"),
              Path("llms.txt"),
          ]
          forbidden = ["?閮??株撒?", "digital twin", "trilingual", "designed with claude"]
          for path in outputs:
              text = path.read_text(encoding="utf-8").casefold()
              matches = [term for term in forbidden if term.casefold() in text]
              if matches:
                  raise SystemExit(f"{path}: stale terms remain: {matches}")

          sitemap = Path("sitemap.xml")
          root = ET.parse(sitemap).getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locs = [
              (node.text or "").strip()
              for node in root.findall("sm:url/sm:loc", ns)
          ]
          if not locs:
              raise SystemExit("sitemap.xml: no <loc> entries found")
          base = "https://starriverarts.github.io/StarRiver-Arts-Site/"
          bad = [url for url in locs if not url.startswith(base)]
          if bad:
              raise SystemExit(f"sitemap.xml: URLs outside canonical base: {bad[:5]}")

          robots = Path("robots.txt").read_text(encoding="utf-8")
          expected = base + "sitemap.xml"
          if f"Sitemap: {expected}" not in robots:
              raise SystemExit("robots.txt: canonical sitemap pointer missing")

          print(f"Validated sitemap.xml with {len(locs)} URLs")
          PY
          git diff --check

      - name: Require current indexes in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Commit refreshed indexes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-index site-index.json search-index.json llm-index.json sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "Indexes are already current."
            exit 0
          fi
          git commit -m "build: refresh discovery indexes [skip ci]"
          git push
