name: Refresh Racing Toolkit public data

on:
  workflow_dispatch:
  schedule:
    # Lifecycle-based event/news projections stay current even without a source commit.
    - cron: "17,47 * * * *"
  pull_request:
    paths:
      - "content/racing-toolkit/**"
      - "play/RacingClub/TimeAttack/vrc/*.json"
      - "play/RacingClub/TimeAttack/data/event-editorial.json"
      - "tools/build_racing_toolkit_public.py"
      - "tools/validate_racing_toolkit_public.py"
      - ".github/workflows/refresh-racing-toolkit-data.yml"
  push:
    branches: ["**"]
    paths:
      - "content/racing-toolkit/**"
      - "play/RacingClub/TimeAttack/vrc/*.json"
      - "play/RacingClub/TimeAttack/data/event-editorial.json"
      - "tools/build_racing_toolkit_public.py"
      - "tools/validate_racing_toolkit_public.py"
      - ".github/workflows/refresh-racing-toolkit-data.yml"

permissions:
  contents: write

concurrency:
  group: "racing-toolkit-public-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Web to VRChat projections
        run: python tools/build_racing_toolkit_public.py

      - name: Validate public contracts and privacy boundary
        run: |
          python tools/validate_racing_toolkit_public.py
          python tools/build_racing_toolkit_public.py --check
          git diff --check

      - name: Require checked-in projections in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- play/RacingClub/TimeAttack/vrc/toolkit

      - name: Commit refreshed Toolkit data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/RacingClub/TimeAttack/vrc/toolkit
          if git diff --cached --quiet; then
            echo "Racing Toolkit public data is already current."
            exit 0
          fi
          git commit -m "build: refresh Racing Toolkit public data"
          git push
